version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned by the Expo SDK; upgraded together with `npx expo install --fix`.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      # 10.1 declares an optional peer on Expo SDK 58, which fails to resolve on SDK 57.
      - dependency-name: 'tinybase'
        update-types: ['version-update:semver-minor']
      # Major upgrades are reviewed by hand.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
